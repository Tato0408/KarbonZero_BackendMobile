spring.application.name=karbonzeromovil

# Carga las variables desde un archivo .env local (si existe). Las variables de entorno reales
# (por ejemplo, las Config Vars de Heroku) tienen prioridad sobre este archivo.
spring.config.import=optional:file:.env[.properties]

#server.port = 8081
server.servlet.context-path=/

# JWT
security.jwt.secret=${SECRET_KEY_JWT}
security.jwt.issuer=${SECURITY_JWT_ISSUER:karbonZeroManagement}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# DATABASE
spring.datasource.url = ${DB_URL}
spring.datasource.username = ${DB_USER}
spring.datasource.password = ${DB_PASSWORD}
spring.datasource.driver-class-name = ${DB_DRIVER:oracle.jdbc.OracleDriver}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com